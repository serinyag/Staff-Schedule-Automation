name: Repository Checks

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if available
        run: |
          node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts.lint ? 0 : 1)" \
            && npm run lint \
            || echo "No lint script defined; skipping."

      - name: Run typecheck if available
        run: |
          node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts.typecheck ? 0 : 1)" \
            && npm run typecheck \
            || echo "No typecheck script defined; skipping."

      - name: Validate scheduling contract JSON Schemas
        run: |
          node -e "const fs=require('fs'); ['packages/scheduling-contracts/planning-context.schema.json','packages/scheduling-contracts/draft-plan.schema.json','packages/scheduling-contracts/validation-result.schema.json'].forEach((file)=>JSON.parse(fs.readFileSync(file,'utf8')));"

      - name: Validate rule catalogue YAML
        run: |
          node -e "const fs=require('fs'); const yaml=require('js-yaml'); yaml.load(fs.readFileSync('packages/scheduling-rules/wnc-staff-scheduling.v2.yaml','utf8'));"
