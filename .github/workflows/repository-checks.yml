name: Repository Checks
on: [pull_request, push]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: pip install -r services/scheduling-engine/requirements-dev.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python -m pytest services/scheduling-engine/tests
      - run: bash scripts/test-runtime-database.sh
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
